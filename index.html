<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test interactivo: Sensores e IoT</title>
<style>

// Baraja las opciones manteniendo el índice correcto
const state=qs.map(([q,opts,correct])=>{const a=opts.map((t,i)=>({t,ok:i===correct}));for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return {q,a,chosen:null}});
function render(){let score=state.filter(x=>x.chosen!==null&&x.a[x.chosen].ok).length;let done=state.filter(x=>x.chosen!==null).length;document.getElementById('progress').textContent=`Respondidas: ${done}/${state.length}`;document.getElementById('score').textContent=`Aciertos: ${score}`;document.getElementById('quiz').innerHTML=state.map((x,i)=>`<section class="card"><p class="question">${i+1}. ${x.q}</p>${x.a.map((o,j)=>`<button class="option ${x.chosen===j?(o.ok?'correct':'wrong'):''}" ${x.chosen!==null?'disabled':''} onclick="answer(${i},${j})">${String.fromCharCode(65+j)}. ${o.t}</button>`).join('')}<div class="feedback ${x.chosen===null?'':x.a[x.chosen].ok?'ok':'bad'}">${x.chosen===null?'':x.a[x.chosen].ok?'¡Correcto!':'Incorrecto. La respuesta correcta está marcada en verde.'}</div></section>`).join('')}
